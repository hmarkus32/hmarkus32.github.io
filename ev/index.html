<style>
:root{--bg:#0c0d0f;--card:#16181c;--line:#25282d;--tx:#f0f2f4;--mu:#9aa0a6;--ac:#FFB100;--ac2:#ffc933;--ac-soft:#3a2f14}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--tx);font:15px/1.45 Outfit,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px;width:100%}
.logo-title{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;flex-shrink:0;object-fit:contain}
h1{font-weight:700;font-size:24px;margin:0;letter-spacing:-.3px;color:var(--ac)}
#upd{color:var(--mu);font-size:12px}
.filters-wrap{position:sticky;top:0;z-index:5;background:rgba(12,13,15,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);width:100%}
.filters-toggle{width:100%;background:none;border:none;color:var(--tx);padding:10px 16px;font:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.filters-toggle:active{background:#1c1e22}
.filters{display:none;flex-wrap:wrap;gap:12px;padding:0 12px 16px;width:100%}.filters.open{display:flex}
.f{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 140px}.f label{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;font-weight:500}
select,input{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;min-width:0;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:16px;padding:8px 14px;cursor:pointer;font-size:13px;user-select:none;font-weight:500}
.chip.on{color:#000;border-color:var(--ac);background:var(--ac)}
button.reset{background:none;border:1px solid var(--line);color:var(--mu);border-radius:10px;padding:10px 16px;cursor:pointer;align-self:flex-end;font:inherit}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;width:100%;max-width:100%;box-sizing:border-box}
.kpi{background:var(--card);border-radius:14px;padding:14px;min-width:0;width:100%;border:1px solid #1f2226}.kpi b{display:block;font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--ac)}.kpi span{color:var(--mu);font-size:12px;font-weight:500}
.kpi:nth-child(5){grid-column:1/-1}
.grid{display:grid;grid-template-columns:1fr;gap:12px;padding:0 12px 20px;width:100%;max-width:100%;box-sizing:border-box}
.card{background:var(--card);border-radius:14px;padding:12px;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden;border:1px solid #1f2226}.card h3{margin:0 0 8px;font-weight:600;font-size:13px;color:var(--mu)}
.ch{height:220px;width:100%;max-width:100%}.wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}th{color:var(--mu);font-weight:600;text-align:left;cursor:pointer;position:sticky;top:0;background:var(--card);padding:10px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid #1d2024}.tw{max-height:420px;overflow:auto;-webkit-overflow-scrolling:touch;width:100%}
@media(min-width:700px){
  .kpis{grid-template-columns:repeat(5,1fr);padding:16px 24px}
  .kpi:nth-child(5){grid-column:auto}
  .grid{grid-template-columns:repeat(2,1fr);padding:0 24px 16px}
  .filters{padding:0 24px 16px}
  header{padding:20px 24px 4px}
  .ch{height:280px}
}

<div class="filters-wrap">

<script>
const $=id=>document.getElementById(id),DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SPEED=[['Slow <7kW',0,7],['L2 7–20',7,20],['DC 20–100',20,100],['Fast 100+',100,1e9]];
const TOD=[['Night 0–6',0,6],['Morning 6–12',6,12],['Afternoon 12–18',12,18],['Evening 18–24',18,24]];
const COL={'Rivian Adventure Network':'#FFB100','Workplace – Weave':'#5b8c9a','Workplace – Qualtrics':'#7d9b6a','Home':'#a8a39a','Tesla Supercharger':'#c45c4a','Other':'#888'};
let S=[],F={n:new Set,s:new Set,d:new Set,t:new Set},sortK='s',sortD=-1;
const C={};['cT','cN','cL','cS'].forEach(k=>C[k]=echarts.init($(k),null,{renderer:'canvas'}));
function resizeCharts(){Object.values(C).forEach(c=>c.resize())}
addEventListener('resize',resizeCharts);
const base={backgroundColor:'transparent',textStyle:{color:'#9aa0a6',fontFamily:'Outfit'},animationDuration:500,animationDurationUpdate:600,animationEasingUpdate:'cubicInOut',grid:{left:36,right:36,top:28,bottom:28},tooltip:{trigger:'axis',backgroundColor:'#1c1e22',borderColor:'#333',textStyle:{color:'#f0f2f4',fontFamily:'Outfit'}}};
const ax={axisLine:{lineStyle:{color:'#2a2e33'}},splitLine:{lineStyle:{color:'#1c1e22'}}};
function chips(id,items,set){const el=$(id);items.forEach(it=>{const c=document.createElement('span');c.className='chip';c.textContent=it;c.onclick=()=>{set.has(it)?set.delete(it):set.add(it);c.classList.toggle('on');render()};el.appendChild(c)})}
function preset(days){const t=new Date();$('d1').value='';$('d0').value=days?new Date(t-days*864e5).toISOString().slice(0,10):'';render()}
$('ftog').onclick=()=>{const f=$('filters');f.classList.toggle('open');$('farrow').textContent=f.classList.contains('open')?'▲':'▼'};
fetch('data.json?t='+Date.now()).then(r=>r.json()).then(j=>{S=j.sessions;$('upd').textContent='Updated '+new Date(j.generated).toLocaleString();
 chips('fn',[...new Set(S.map(x=>x.net))],F.n);chips('fs',SPEED.map(x=>x[0]),F.s);chips('fd',DOW,F.d);chips('ft',TOD.map(x=>x[0]),F.t);
 [['30D',30],['90D',90],['YTD',-1],['1Y',365],['All',0]].forEach(([l,d])=>{const c=document.createElement('span');c.className='chip';c.textContent=l;c.onclick=()=>d<0?($('d0').value=new Date().getFullYear()+'-01-01',$('d1').value='',render()):preset(d);$('fp').appendChild(c)});
 const locs={};S.forEach(x=>locs[x.site]=(locs[x.site]||0)+1);Object.entries(locs).sort((a,b)=>b[1]-a[1]).forEach(([l,n])=>$('fl').add(new Option(`${l} (${n})`,l)));
 ['fl','d0','d1','c0','c1'].forEach(i=>$(i).oninput=render);
 $('rst').onclick=()=>{Object.values(F).forEach(s=>s.clear());document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));['fl','d0','d1','c0','c1'].forEach(i=>$(i).value='');render()};
 const cols=[['s','Start'],['net','Network'],['site','Location'],['kwh','kWh'],['cost','Cost'],['ppk','$/kWh'],['kw','Avg kW'],['d','Min']];
 cols.forEach(([k,l])=>{const th=document.createElement('th');th.textContent=l;th.onclick=()=>{sortD=sortK==k?-sortD:-1;sortK=k;table(cur)};$('th').appendChild(th)});render();setTimeout(resizeCharts,100)});
const inB=(B,lbls,v)=>!lbls.size||B.some(b=>lbls.has(b[0])&&v>=b[1]&&v<b[2]);
let cur=[];
function filt(){const l=$('fl').value,d0=$('d0').value,d1=$('d1').value,c0=parseFloat($('c0').value),c1=parseFloat($('c1').value);
 return S.filter(x=>(!F.n.size||F.n.has(x.net))&&(!l||x.site==l)&&(!d0||x.day>=d0)&&(!d1||x.day<=d1)&&inB(SPEED,F.s,x.kw)&&inB(TOD,F.t,x.h)&&(!F.d.size||F.d.has(DOW[x.dow]))&&(isNaN(c0)||(x.ppk!=null&&x.ppk>=c0))&&(isNaN(c1)||(x.ppk!=null&&x.ppk<=c1)))}
const fm=(n,d=0)=>n.toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
let raf;function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}
function draw(){const R=cur=filt();const kwh=R.reduce((a,x)=>a+x.kwh,0),paid=R.filter(x=>x.cost!=null),cost=paid.reduce((a,x)=>a+x.cost,0),pk=paid.reduce((a,x)=>a+x.kwh,0),hrs=R.reduce((a,x)=>a+x.d/60,0);
 $('k1').textContent=fm(R.length);$('k2').textContent=fm(kwh)+' kWh';$('k3').textContent='$'+fm(cost,2);$('k4').textContent=pk?'$'+fm(cost/pk,3):'–';$('k5').textContent=hrs?fm(kwh/hrs,1)+' kW':'–';
 const days=R.map(x=>x.day).sort(),span=days.length?(new Date(days.at(-1))-new Date(days[0]))/864e5:0,wk=span<120,key=x=>wk?x.day:x.day.slice(0,7);
 const M={};R.forEach(x=>{const k=key(x);M[k]=M[k]||{c:0,e:0};M[k].c+=x.cost||0;M[k].e+=x.kwh});const ks=Object.keys(M).sort();
